<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(135deg,#ffb6d9,#ff85c2,#ffcce6);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    color:white;
}
.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 8s linear infinite;
    opacity:0.7;
}
@keyframes float{
    0%{transform:translateY(100vh) scale(0.5);opacity:0;}
    50%{opacity:1;}
    100%{transform:translateY(-120vh) scale(1.2);opacity:0;}
}
.container{
    width:90%;
    max-width:500px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:30px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    z-index:10;
}
.page{display:none;}
.active{display:block;}
.teddy{font-size:80px;margin-bottom:20px;animation:bounce 2s infinite;}
.teddy-pair{font-size:80px;margin-bottom:20px;animation:bounce 2s infinite;display:flex;justify-content:center;gap:10px;align-items:center;}
.teddy-pair span{display:inline-block;}
.page1-image{max-width:100%;height:auto;border-radius:20px;margin-bottom:20px;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
h1{font-size:2.2rem;margin-bottom:20px;}
.subtitle{font-size:1.1rem;margin-bottom:20px;}
.sparkle{animation:sparkle 1.5s infinite alternate;}
@keyframes sparkle{from{transform:scale(1);}to{transform:scale(1.05);}}
button{border:none;padding:15px 30px;border-radius:50px;font-size:1rem;cursor:pointer;margin:10px;font-weight:bold;}
.yes-btn{background:#ff4d88;color:white;box-shadow:0 5px 15px rgba(255,77,136,0.5);transition:0.3s;}
.yes-btn:hover{transform:scale(1.1);}
.no-btn{background:#0066ff;color:white;z-index:999;transition:0.1s linear;box-shadow:0 5px 20px rgba(0,102,255,0.6);font-weight:bold;border:3px solid white;position:relative;}
.form{display:flex;flex-direction:column;gap:18px;margin-top:20px;}
select,input{padding:15px;border:none;border-radius:15px;font-size:1rem;outline:none;}
.submit-btn{background:#ff4d88;color:white;}
.final-message{font-size:2rem;line-height:1.5;}
</style>
</head>
<body>
<!-- Floating Hearts -->
<script>
for(let i=0;i<35;i++){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    document.body.appendChild(heart);
}
</script>
<!-- Hidden Audio Element -->
<audio id="celebrationMusic" loop>
    <source src="New.mp3" type="audio/mpeg">
</audio>
<!-- PAGE 1 -->
<div class="container page active" id="page1">
    <img src="Img.webp" alt="Special photo" class="page1-image">
    <div class="teddy">🧸</div>
    <h1 class="sparkle">
        Would You Like To Go Out With Me, Robin?
    </h1>
    <p class="subtitle">
        Pretty please? ❤️
    </p>
    <button class="yes-btn" onclick="showPage2()">
        Yes 💖
    </button>
    <button class="no-btn" id="noBtn">
        No 😢
    </button>
</div>
<!-- PAGE 2 -->
<div class="container page" id="page2">
    <div class="teddy-pair">
        <span>🧸</span>
        <span>💐</span>
        <span>🧸</span>
    </div>
    <h1>YAYYYYY!!! 🎉</h1>
    <form id="dateForm">
        <select id="activity" required>
            <option value="">Choose our date ❤️</option>
            <option>South Bank Parklands 🌸</option>
            <option>Lone Pine Koala Sanctuary 🐨</option>
            <option>City Botanic Gardens 🌺</option>
            <option>Breakfast at Newstead House ☕</option>
            <option>Kayaking on Brisbane River 🚣</option>
            <option>Southbank Culture Precinct 🎭</option>
            <option>Mount Coot-tha Lookout 🏔️</option>
            <option>Dinner at Eagle Street Pier 🍽️</option>
            <option>Movie at Event Cinemas Southbank 🎬</option>
            <option>Picnic at New Farm Park 🌳</option>
        </select>
        <input type="date" id="date" required>
        <input type="time" id="time" required>
        <button type="submit" class="submit-btn">
            Confirm Date ❤️
        </button>
    </form>
</div>
<!-- PAGE 3 -->
<div class="container page" id="page3">
    <div class="teddy">🧸💖</div>
    <div class="final-message sparkle">
        I can't wait to see you, Robin ❤️
        <br><br>
        This is going to be magical ✨
    </div>
</div>
<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
// EMAILJS INIT
emailjs.init("7PctZidwByvIFpZed");
// PAGE CHANGE
function showPage2(){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
    setDateConstraints();
    // Play celebration music
    const audio = document.getElementById("celebrationMusic");
    audio.currentTime = 0;
    audio.volume = 1;
    const playPromise = audio.play();
    
    if (playPromise !== undefined) {
        playPromise.catch(error => {
            console.log("Audio autoplay failed (this is normal in some browsers):", error);
            console.log("User may need to click on the page first to enable sound");
        });
    }
}
// SET DATE CONSTRAINTS - ONLY NEXT 30 DAYS
function setDateConstraints(){
    const dateInput = document.getElementById("date");
    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate() + 1);
    const thirtyDaysFromNow = new Date(today);
    thirtyDaysFromNow.setDate(today.getDate() + 30);
    
    const formatDate = (date) => date.toISOString().split('T')[0];
    
    dateInput.min = formatDate(tomorrow);
    dateInput.max = formatDate(thirtyDaysFromNow);
}
// NO BUTTON MOVE ON CLICK
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("click", function moveNoButton(e) {
    // after first click, change to fixed positioning
    noBtn.style.position = "fixed";
    // get button size after set to fixed just in case
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth;
    const maxY = window.innerHeight - btnHeight;
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});
// FORM SUBMIT
    document.getElementById("dateForm").addEventListener("submit",function(e){
        e.preventDefault();
        const activity=document.getElementById("activity").value;
        const date=document.getElementById("date").value;
        const time=document.getElementById("time").value;
        emailjs.send("service_f03t4oh","template_u9q501c",{
            activity:activity,
            date:date,
            time:time,
            to_email:"di28812@gmail.com"
        })
        .then(function(response){
            console.log("SUCCESS!",response.status,response.text);
            document.getElementById("page2").classList.remove("active");
            document.getElementById("page3").classList.add("active");
        })
        .catch(function(error){
            console.log("FAILED...",error);
            alert("Something went wrong 😢");
        });
    });
</script>
</body>
</html>
