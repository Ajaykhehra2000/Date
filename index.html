<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(135deg,#ffb6d9,#ff85c2,#ffcce6);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    position:relative;
}

/* Floating hearts */
.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 8s linear infinite;
    font-size:24px;
    opacity:0.7;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.2);
        opacity:0;
    }
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:40px;
    border-radius:30px;
    text-align:center;
    width:90%;
    max-width:500px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    z-index:10;
}

.page{
    display:none;
}

.active{
    display:block;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

.subtitle{
    margin-bottom:20px;
    font-size:1.1rem;
}

.teddy{
    font-size:80px;
    margin-bottom:20px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
    margin:10px;
    font-weight:bold;
}

.yes-btn{
    background:#ff4d88;
    color:white;
    box-shadow:0 5px 15px rgba(255,77,136,0.5);
}

.yes-btn:hover{
    transform:scale(1.1);
}

.no-btn{
    position:absolute;
    background:#ff99bb;
    color:white;
}

form{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin-top:20px;
}

select,input{
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:1rem;
    outline:none;
}

.submit-btn{
    background:#ff4d88;
    color:white;
}

.final-message{
    font-size:2rem;
    line-height:1.5;
}

.sparkle{
    animation:sparkle 1.5s infinite alternate;
}

@keyframes sparkle{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.05);
    }
}
</style>
</head>

<body>

<!-- Floating Hearts -->
<script>
for(let i=0;i<30;i++){
    const heart=document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML='❤️';
    heart.style.left=Math.random()*100+'vw';
    heart.style.animationDuration=(5+Math.random()*5)+'s';
    heart.style.fontSize=(20+Math.random()*30)+'px';
    document.body.appendChild(heart);
}
</script>

<!-- PAGE 1 -->
<div class="container page active" id="page1">

    <div class="teddy">🧸</div>

    <h1 class="sparkle">
        Would You Like To Go Out With Me?
    </h1>

    <p class="subtitle">
        Pretty please? ❤️
    </p>

    <button class="yes-btn" onclick="showPage2()">
        Yes 💖
    </button>

    <button class="no-btn" id="noBtn">
        No 😢
    </button>

</div>

<!-- PAGE 2 -->
<div class="container page" id="page2">

    <div class="teddy">🧸💖</div>

    <h1>YAYYYYY!!! 🎉</h1>

    <form id="dateForm">

        <select id="activity" required>
            <option value="">Choose our date ❤️</option>
            <option>Dinner Date 🍝</option>
            <option>Movie Night 🎬</option>
            <option>Ice Cream 🍦</option>
            <option>Bowling 🎳</option>
            <option>Beach Walk 🌊</option>
            <option>Coffee Date ☕</option>
            <option>Arcade 🎮</option>
            <option>Long Drive 🚗</option>
            <option>Picnic 🌸</option>
            <option>Shopping 🛍️</option>
        </select>

        <input type="date" id="date" required>

        <input type="time" id="time" required>

        <button type="submit" class="submit-btn">
            Confirm Date ❤️
        </button>

    </form>

</div>

<!-- PAGE 3 -->
<div class="container page" id="page3">

    <div class="teddy">🧸💕</div>

    <div class="final-message sparkle">
        I can't wait to see you ❤️<br><br>
        This is going to be magical ✨
    </div>

</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

// EMAILJS INIT
emailjs.init("7PctZidwByvIFpZed");

const noBtn=document.getElementById("noBtn");

// Move No button
function moveButton(){

    const maxX=window.innerWidth-noBtn.offsetWidth;
    const maxY=window.innerHeight-noBtn.offsetHeight;

    const randomX=Math.floor(Math.random()*maxX);
    const randomY=Math.floor(Math.random()*maxY);

    noBtn.style.left=randomX+"px";
    noBtn.style.top=randomY+"px";
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

function showPage2(){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
}

// Form Submit
document.getElementById("dateForm").addEventListener("submit",function(e){

    e.preventDefault();

    const activity=document.getElementById("activity").value;
    const date=document.getElementById("date").value;
    const time=document.getElementById("time").value;

    emailjs.send("service_f03t4oh","template_u9q501c",{
        activity:activity,
        date:date,
        time:time,
        to_email:"di28812@gmail.com"
    })

    .then(function(response){

        console.log("SUCCESS!",response.status,response.text);

        document.getElementById("page2").classList.remove("active");
        document.getElementById("page3").classList.add("active");

    },function(error){

        alert("Oops! Something went wrong 😢");
        console.log(error);

    });

});

</script>

</body>
</html>
