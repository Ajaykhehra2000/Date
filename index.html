<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(135deg,#ffb6d9,#ff85c2,#ffcce6);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    color:white;
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 8s linear infinite;
    opacity:0.7;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.2);
        opacity:0;
    }
}

.container{
    width:90%;
    max-width:500px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border-radius:30px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    z-index:10;
}

.page{
    display:none;
}

.active{
    display:block;
}

.teddy{
    font-size:80px;
    margin-bottom:20px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

.subtitle{
    font-size:1.1rem;
    margin-bottom:20px;
}

.sparkle{
    animation:sparkle 1.5s infinite alternate;
}

@keyframes sparkle{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.05);
    }
}

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    font-size:1rem;
    cursor:pointer;
    margin:10px;
    font-weight:bold;
}

.yes-btn{
    background:#ff4d88;
    color:white;
    box-shadow:0 5px 15px rgba(255,77,136,0.5);
    transition:0.3s;
}

.yes-btn:hover{
    transform:scale(1.1);
}

.no-btn{
    background:#0066ff;
    color:white;
    z-index:999;
    transition:0.1s linear;
    box-shadow:0 5px 20px rgba(0,102,255,0.6);
    font-weight:bold;
    border:3px solid white;
}

form{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin-top:20px;
}

select,input{
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:1rem;
    outline:none;
}

.submit-btn{
    background:#ff4d88;
    color:white;
}

.final-message{
    font-size:2rem;
    line-height:1.5;
}

</style>
</head>

<body>

<!-- Floating Hearts -->
<script>

for(let i=0;i<35;i++){

    const heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";

    heart.style.animationDuration=(5+Math.random()*5)+"s";

    heart.style.fontSize=(20+Math.random()*30)+"px";

    document.body.appendChild(heart);
}

</script>

<!-- PAGE 1 -->
<div class="container page active" id="page1">

    <div class="teddy">🧸</div>

    <h1 class="sparkle">
        Would You Like To Go Out With Me?
    </h1>

    <p class="subtitle">
        Pretty please? ❤️
    </p>

    <button class="yes-btn" onclick="showPage2()">
        Yes 💖
    </button>

    <button class="no-btn" id="noBtn">
        No 😢
    </button>

</div>

<!-- PAGE 2 -->
<div class="container page" id="page2">

    <div class="teddy">🧸💕</div>

    <h1>YAYYYYY!!! 🎉</h1>

    <form id="dateForm">

        <select id="activity" required>

            <option value="">Choose our date ❤️</option>

            <option>Dinner Date 🍝</option>

            <option>Movie Night 🎬</option>

            <option>Ice Cream 🍦</option>

            <option>Bowling 🎳</option>

            <option>Beach Walk 🌊</option>

            <option>Coffee Date ☕</option>

            <option>Arcade 🎮</option>

            <option>Long Drive 🚗</option>

            <option>Picnic 🌸</option>

            <option>Shopping 🛍️</option>

        </select>

        <input type="date" id="date" required>

        <input type="time" id="time" required>

        <button type="submit" class="submit-btn">
            Confirm Date ❤️
        </button>

    </form>

</div>

<!-- PAGE 3 -->
<div class="container page" id="page3">

    <div class="teddy">🧸💖</div>

    <div class="final-message sparkle">

        I can't wait to see you ❤️
        <br><br>
        This is going to be magical ✨

    </div>

</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

// =======================
// EMAILJS INIT
// =======================

emailjs.init("7PctZidwByvIFpZed");

// =======================
// PAGE CHANGE
// =======================

function showPage2(){

    document.getElementById("page1").classList.remove("active");

    document.getElementById("page2").classList.add("active");
}

// =======================
// BOUNCING NO BUTTON
// =======================

const noBtn=document.getElementById("noBtn");

// Position variables
let x=0;
let y=0;
let dx=0;
let dy=0;
let isMoving=false;

// Button Size
let btnWidth=noBtn.offsetWidth;
let btnHeight=noBtn.offsetHeight;

// Animation Loop
function animateButton(){

    if(isMoving){
        const screenWidth=window.innerWidth;
        const screenHeight=window.innerHeight;

        x+=dx;
        y+=dy;

        // Keep button within bounds
        if(x<=0){
            x=0;
            dx=Math.abs(dx);
        }
        if(x+btnWidth>=screenWidth){
            x=screenWidth-btnWidth;
            dx=-Math.abs(dx);
        }

        if(y<=0){
            y=0;
            dy=Math.abs(dy);
        }
        if(y+btnHeight>=screenHeight){
            y=screenHeight-btnHeight;
            dy=-Math.abs(dy);
        }

        noBtn.style.position="fixed";
        noBtn.style.left=x+"px";
        noBtn.style.top=y+"px";
    }

    requestAnimationFrame(animateButton);
}

animateButton();

// Teleport on click
noBtn.addEventListener("click",(e)=>{
    e.preventDefault();

    if(!isMoving){
        isMoving=true;
        noBtn.style.position="fixed";
    }

    const maxX=window.innerWidth-btnWidth;
    const maxY=window.innerHeight-btnHeight;

    x=Math.random()*maxX;
    y=Math.random()*maxY;

    // Set random velocity
    dx=(Math.random()-0.5)*6;
    dy=(Math.random()-0.5)*6;

    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
});

// =======================
// FORM SUBMIT
// =======================

document.getElementById("dateForm").addEventListener("submit",function(e){

    e.preventDefault();

    const activity=document.getElementById("activity").value;

    const date=document.getElementById("date").value;

    const time=document.getElementById("time").value;

    // SEND EMAIL
    emailjs.send("service_f03t4oh","template_u9q501c",{

        activity:activity,
        date:date,
        time:time,
        to_email:"di28812@gmail.com"

    })

    .then(function(response){

        console.log("SUCCESS!",response.status,response.text);

        document.getElementById("page2").classList.remove("active");

        document.getElementById("page3").classList.add("active");

    })

    .catch(function(error){

        console.log("FAILED...",error);

        alert("Something went wrong 😢");

    });

});

</script>

</body>
</html>
